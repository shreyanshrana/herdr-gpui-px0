id = "herdr-px0"
name = "px0"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Herdr plugin to open px0 beside the terminal; requires Herdr GPUI with browser CLI support."
platforms = ["macos"]

[[actions]]
id = "open"
title = "px0: open beside terminal"
contexts = ["workspace"]
command = ["python3", "plugin.py", "open"]

[[actions]]
id = "close"
title = "px0: close in this workspace"
contexts = ["workspace"]
command = ["python3", "plugin.py", "close"]
